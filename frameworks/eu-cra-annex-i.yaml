key: eucra
id: eu-cra-annex-i
scope: eu-cra
displayName: "EU Cyber Resilience Act: Annex I essential cybersecurity requirements"
version: "Regulation (EU) 2024/2847"
source: "https://eur-lex.europa.eu/eli/reg/2024/2847/oj"
description: "The essential cybersecurity requirements for products with digital elements: Part I on the properties of the product and Part II on vulnerability handling, restricted to those that scanning can speak to or that call for an SBOM."
note: "An approximation, and the requirements apply to manufacturers of products placed on the EU market on dates set in the Regulation, which are not restated here. Ids: I.2.a is Annex I, Part I, point 2(a); II.1 is Part II, point 1."
evidenceWindowDays: 30
verification:
  level: primary
  how: "Annex I, Part I points 2(a) to (m) and Part II points 1 to 8 were read in the official text of the Regulation on EUR-Lex (CELEX 32024R2847)."
licence: "EU law, which may be reproduced. The published wording is shortened in the control names."
decisions:
  - "Part II is the part about vulnerability handling and is listed in full (all eight points); Part I is listed only for the points a scan can speak to (2(a) to (f)) and for attack surface (2(j))."
  - "I.2.a asks for products 'without known exploitable vulnerabilities'. Rampart reads open high and critical findings in components. Whether a vulnerability is known to be exploitable is the CISA KEV list, which a control cannot test yet (docs/FOUNDATION.md, item 2)."
  - "II.2 asks for vulnerabilities to be remediated 'without delay'. Time is not testable in a control today (docs/FOUNDATION.md, item 2); the SLA policy sets the deadlines."
limits:
  - "The Regulation also covers conformity assessment, reporting of actively exploited vulnerabilities and the duties of importers and distributors; none is a scanner finding."
  - "Whether a product is in scope, and the dates from which each obligation applies, are for the manufacturer to establish from the Regulation."
controls:
  - {id: I.2.a, name: "Made available without known exploitable vulnerabilities", categories: [sca, container], minSeverity: high, evidence: [sca, container], why: "Open high or critical findings in components are known vulnerabilities not yet removed; exploitability itself is not tested (KEV)."}
  - {id: I.2.b, name: "Made available with a secure by default configuration", categories: [iac, cspm], minSeverity: medium, why: "Misconfiguration findings are configurations that are not secure by default."}
  - {id: I.2.c, name: "Vulnerabilities can be addressed through security updates", manual: true, why: "An update mechanism is a product feature."}
  - {id: I.2.d, name: "Protection from unauthorised access by appropriate control mechanisms", cwes: [287, 306, 862, 863], why: "Improper authentication, missing authentication, missing and incorrect authorisation."}
  - {id: I.2.e, name: "Protect the confidentiality of stored, transmitted or processed data", cwes: [311, 312, 319], why: "Missing encryption and cleartext storage or transmission."}
  - {id: I.2.f, name: "Protect the integrity of data, commands, programs and configuration against unauthorised modification", cwes: [345, 494], why: "Insufficient verification of authenticity and code downloaded without an integrity check."}
  - {id: I.2.j, name: "Designed, developed and produced to limit attack surfaces, including external interfaces", manual: true, why: "Attack surface is a design property."}
  - {id: II.1, name: "Identify and document vulnerabilities and components, including a software bill of materials covering at least the top-level dependencies", manual: true, description: "Evidence: an SBOM is uploaded for every application.", why: "The requirement is an SBOM, whose presence Rampart cannot yet test as evidence (docs/FOUNDATION.md, item 3)."}
  - {id: II.2, name: "Address and remediate vulnerabilities without delay, including by providing security updates", categories: [sca, container, sast, dast], minSeverity: high, why: "Open high or critical findings are vulnerabilities not yet remediated; 'without delay' is a deadline, set by the SLA policy."}
  - {id: II.3, name: "Apply effective and regular tests and reviews of the security of the product", categories: [sca, container, sast, dast], minSeverity: critical, evidence: [sca, container, sast, dast], description: "Read as: tested lately, and nothing critical left open.", why: "A recent scan evidences regular testing; the severity floor stops the control failing on every finding the testing exists to find."}
  - {id: II.4, name: "Once a security update is available, publicly disclose information about fixed vulnerabilities", manual: true, why: "Publishing an advisory is a communication."}
  - {id: II.5, name: "Put in place and enforce a policy on coordinated vulnerability disclosure", manual: true, why: "A policy is a document."}
  - {id: II.6, name: "Facilitate the sharing of information about potential vulnerabilities, including by providing a contact address", manual: true, why: "A contact address is a published fact."}
  - {id: II.7, name: "Provide mechanisms to securely distribute updates", manual: true, why: "Update distribution is a product and infrastructure feature."}
  - {id: II.8, name: "Security updates are disseminated without delay, free of charge, with advisory messages", manual: true, why: "Dissemination is an operational process."}
