key: iso27001
id: iso-27001-2022-extended
scope: iso-27001
displayName: "ISO/IEC 27001:2022 Annex A: supply chain and secure development (complements the built-in A.8 view)"
version: "2022"
source: "https://www.iso.org/standard/27001"
description: "The Annex A controls on suppliers, source code, cryptography and the development life cycle that the built-in framework does not carry. Rampart already carries A.5.17, A.8.8, A.8.9, A.8.28 and A.8.29, so those are not repeated here."
note: "An approximation, and a complement: enable the built-in ISO 27001 framework as well. Most of what ISO 27001 asks for is management-system practice, so most controls here are manual."
evidenceWindowDays: 30
verification:
  level: secondary
  how: "ISO/IEC 27001 and 27002 are sold by ISO, so the text was not read. The identifiers and titles come from published guidance (ISMS.online, Advisera, Scrut and others). A.8.28 to A.8.32 were confirmed by several of them; A.5.19 to A.5.22, A.8.4 and A.8.24 to A.8.27 follow the same published list. Check them against ISO/IEC 27001:2022 before a certification audit."
licence: "ISO's text is copyrighted, so control names here are written in our own words and only the identifiers are the standard's."
decisions:
  - "A complement, not a duplicate: the built-in framework already reads A.5.17, A.8.8, A.8.9, A.8.28 and A.8.29."
  - "Only A.8.24 (use of cryptography) names a property with well-known weaknesses, so only it is matched, with the weakness classes of cryptography itself. Everything else is policy, contract or process and is manual rather than forced onto a scanner."
limits:
  - "The management-system requirements of clauses 4 to 10 (context, leadership, planning, audit, review) are not controls and are not listed."
  - "Controls on people, premises and technology outside software are not listed."
controls:
  - {id: A.5.19, name: "Information security in supplier relationships", manual: true, why: "Supplier relationships are managed by contract and process."}
  - {id: A.5.20, name: "Addressing information security within supplier agreements", manual: true, why: "Agreements are contractual."}
  - {id: A.5.21, name: "Managing information security in the ICT supply chain", manual: true, why: "Supply chain management is organisational. An SBOM is the technical evidence."}
  - {id: A.5.22, name: "Monitoring, review and change management of supplier services", manual: true, why: "Reviewing a supplier is a process."}
  - {id: A.8.4, name: "Access to source code is managed", manual: true, why: "Access to repositories is an access-control setting, not a scan result."}
  - {id: A.8.24, name: "Use of cryptography", cwes: [326, 327, 328, 330, 759, 916], why: "The weaknesses of cryptography itself: weak strength, broken algorithms, weak hashes, poor randomness, weak password hashing."}
  - {id: A.8.25, name: "Secure development life cycle", manual: true, why: "A life cycle is a process."}
  - {id: A.8.26, name: "Application security requirements", manual: true, why: "Requirements are written by people."}
  - {id: A.8.27, name: "Secure system architecture and engineering principles", manual: true, why: "Architecture principles are applied in design."}
  - {id: A.8.30, name: "Outsourced development is supervised and monitored", manual: true, why: "Supervising a contractor is a process."}
  - {id: A.8.31, name: "Development, test and production environments are separated", manual: true, why: "Environment separation is an infrastructure fact, not a scan result."}
  - {id: A.8.32, name: "Changes follow change management procedures", manual: true, why: "Change management is a procedure."}
