key: pcidss
id: pci-dss-4.0.1-extended
scope: pci-dss
displayName: "PCI DSS 4.0.1: configuration, cryptography, scanning and testing (complements the built-in requirement 6 view)"
version: "4.0.1"
source: "https://www.pcisecuritystandards.org/document_library/"
description: "The PCI DSS requirements outside requirement 6 that scanning and testing can speak to (2.2, 3.5, 4.2, 11.3, 11.4), plus the requirement 6 items that are people or process (6.2.1, 6.2.2, 6.3.2, 6.4.2, 6.5.1). Rampart already carries a built-in framework for 6.2.3, 6.2.4, 6.3.1, 6.3.3, 6.4.1 and 8.6.2, so those are not repeated here."
note: "An approximation, and a complement: enable the built-in PCI DSS framework as well. PCI DSS lists no weaknesses, so the cryptography and storage controls use weakness lists that are ours."
evidenceWindowDays: 90
windowWhy: "Requirement 11.3.1 asks for internal vulnerability scans at least once every three months, so a scan within 90 days is evidence."
verification:
  level: secondary
  how: "The standard is distributed by the PCI Security Standards Council behind a licence agreement, so its text was not read. The requirement numbers and their subjects come from published guidance (Qualys, SecurityMetrics, Schellman and others) and agree with each other; the built-in framework already uses 6.2.3, 6.2.4, 6.3.1, 6.3.3, 6.4.1 and 8.6.2 the same way. Check each against your copy of v4.0.1 before an assessment."
licence: "The PCI DSS text belongs to the PCI Security Standards Council, so control names here are written in our own words and only the requirement numbers are the standard's."
decisions:
  - "A complement, not a duplicate: the built-in framework reads requirement 6 by scan category with a 30-day window and no severity floor. A second framework that read the same requirements differently would give two answers for one control, so the overlapping ones are left to it."
  - "Scanning and testing requirements (11.3.1) read recent scans plus open high or critical findings. External scans by an Approved Scanning Vendor (11.3.2) and penetration tests (11.4.x) are done by named parties, so they are manual."
  - "2.2.1, 3.5.1 and 4.2.1 name a property rather than a weakness. They use the weakness classes that break the property (METHOD.md); PCI DSS itself maps none."
limits:
  - "Requirements about cardholder data environments, network segmentation, access control, logging and physical security are not listed: they are not software findings."
  - "6.3.3 (patching) is read by the built-in framework and, as a deadline, by the `pci-dss` profile of the SLA policy."
controls:
  - {id: "2.2.1", name: "Configuration standards are developed, implemented and maintained for all system components", categories: [iac, cspm], minSeverity: medium, why: "Misconfiguration findings show where a configuration standard is not applied."}
  - {id: "3.5.1", name: "Stored account data is rendered unreadable wherever it is stored", cwes: [311, 312, 313], why: "The weaknesses that leave stored data unencrypted."}
  - {id: "4.2.1", name: "Strong cryptography protects account data in transit over open public networks", cwes: [319, 295, 297, 326, 327], why: "Cleartext transmission, certificate validation failures, weak strength and broken algorithms."}
  - {id: "6.2.1", name: "Bespoke and custom software is developed securely", manual: true, why: "A secure development process is a practice."}
  - {id: "6.2.2", name: "Software development personnel are trained in secure development at least every twelve months", manual: true, why: "Training is an organisational record."}
  - {id: "6.3.2", name: "An inventory of bespoke and custom software and third-party components is maintained", manual: true, description: "Evidence: an SBOM is uploaded for every application.", why: "The inventory is the SBOM, whose presence Rampart cannot yet test as evidence (docs/FOUNDATION.md, item 3)."}
  - {id: "6.4.2", name: "An automated technical solution that detects and prevents web-based attacks protects public-facing web applications", manual: true, description: "Evidence: the application's compensating controls list a WAF or API gateway.", why: "The presence of a web application firewall is a deployment fact the application states about itself, not a scan result."}
  - {id: "6.5.1", name: "Changes to system components follow change control procedures", manual: true, why: "Change control is a procedure."}
  - {id: "11.3.1", name: "Internal vulnerability scans are run at least every three months, high-risk and critical findings are resolved and rescanned", categories: [sca, container, sast, dast, iac], minSeverity: high, evidence: [sca, container, sast, dast], why: "A scan within the window evidences the scan, and open high or critical findings are the ones not yet resolved."}
  - {id: "11.3.2", name: "External vulnerability scans are run at least every three months by an Approved Scanning Vendor", manual: true, why: "The scan must be done by a PCI Approved Scanning Vendor, which Rampart is not."}
  - {id: "11.4.1", name: "A penetration testing methodology is defined, documented and implemented", manual: true, why: "A methodology is a document."}
  - {id: "11.4.2", name: "Internal penetration testing is performed at least every twelve months and after significant change", manual: true, why: "Penetration tests are done and reported by people."}
  - {id: "11.4.3", name: "External penetration testing is performed at least every twelve months and after significant change", manual: true, why: "Penetration tests are done and reported by people."}
