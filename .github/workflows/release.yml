# Releases the policy set: a tag vX.Y.Z publishes the chart as an OCI artifact on GHCR, signed and with provenance, and
# creates the GitHub release. The tag must match the version in Chart.yaml.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  CHART_DIR: charts/rampart-policies
  CHART_NAME: rampart-policies

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: Package, publish, sign
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: The tag, Chart.yaml and CHANGELOG.md agree
        id: meta
        run: |
          ver="${GITHUB_REF_NAME#v}"
          chart="$(yq '.version' "$CHART_DIR/Chart.yaml")"
          [[ "$ver" == "$chart" ]] || { echo "::error::tag $GITHUB_REF_NAME but Chart.yaml says $chart"; exit 1; }
          grep -q "^## \[$ver\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section '## [$ver]'"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # the release notes are the changelog section of this version
          awk -v v="$ver" '$0 ~ "^## \\["v"\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > release-notes.md

      - name: Lint
        run: helm lint --strict "$CHART_DIR"

      - name: Package (README ships with the chart)
        run: |
          cp README.md "$CHART_DIR/README.md"
          mkdir -p dist
          helm package "$CHART_DIR" --destination dist

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR (OCI)
        id: push
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          out="$(helm push "dist/${CHART_NAME}-${{ steps.meta.outputs.version }}.tgz" "oci://$repo" 2>&1)" || { echo "::error::helm push failed: $out"; exit 1; }
          echo "$out"
          digest="$(sed -nE 's/^Digest: (sha256:[a-f0-9]{64})$/\1/p' <<<"$out")"
          [[ -n "$digest" ]] || { echo "::error::could not read the chart digest"; exit 1; }
          echo "chart=$repo/$CHART_NAME" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest provenance of the published chart
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.push.outputs.chart }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest provenance of the archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tgz

      - uses: sigstore/cosign-installer@v3.7.0

      - name: Sign (keyless)
        run: cosign sign --yes "${{ steps.push.outputs.chart }}@${{ steps.push.outputs.digest }}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tgz \
            --title "rampart-policies ${{ steps.meta.outputs.version }}" \
            --notes-file release-notes.md
