apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterComplianceFramework
metadata:
  name: eu-cra-annex-i
spec:
  displayName: 'EU Cyber Resilience Act: Annex I essential cybersecurity requirements'
  version: Regulation (EU) 2024/2847
  source: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
  logoUrl: https://raw.githubusercontent.com/Rampart-Aspm/policies/main/logos/eu-cra-annex-i.svg
  description: 'The essential cybersecurity requirements for products with digital elements: Part I on the properties
    of the product and Part II on vulnerability handling, restricted to those that scanning can speak to or that
    call for an SBOM.'
  note: 'An approximation, and the requirements apply to manufacturers of products placed on the EU market on dates
