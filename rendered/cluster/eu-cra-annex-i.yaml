    II, point 1.'
  appliesTo:
    complianceScope: eu-cra
  evidenceWindowDays: 30
  controls:
  - id: I.2.a
    name: Made available without known exploitable vulnerabilities
    match:
      categories:
      - sca
      - container
      minSeverity: high
    evidence:
      categories:
      - sca
      - container
  - id: I.2.b
    name: Made available with a secure by default configuration
    match:
      categories:
      - iac
      - cspm
      minSeverity: medium
  - id: I.2.c
    name: Vulnerabilities can be addressed through security updates
    manual: true
  - id: I.2.d
    name: Protection from unauthorised access by appropriate control mechanisms
    match:
      cwes:
      - 287
      - 306
      - 862
      - 863
  - id: I.2.e
    name: Protect the confidentiality of stored, transmitted or processed data
    match:
      cwes:
      - 311
      - 312
      - 319
  - id: I.2.f
    name: Protect the integrity of data, commands, programs and configuration against unauthorised modification
    match:
      cwes:
      - 345
      - 494
  - id: I.2.j
    name: Designed, developed and produced to limit attack surfaces, including external interfaces
    manual: true
  - id: II.1
    name: Identify and document vulnerabilities and components, including a software bill of materials covering
      at least the top-level dependencies
    manual: true
    description: 'Evidence: an SBOM is uploaded for every application.'
  - id: II.2
    name: Address and remediate vulnerabilities without delay, including by providing security updates
    match:
      categories:
      - sca
      - container
      - sast
      - dast
      minSeverity: high
  - id: II.3
    name: Apply effective and regular tests and reviews of the security of the product
    match:
      categories:
      - sca
      - container
      - sast
      - dast
      minSeverity: critical
    evidence:
      categories:
      - sca
      - container
      - sast
      - dast
    description: 'Read as: tested lately, and nothing critical left open.'
  - id: II.4
    name: Once a security update is available, publicly disclose information about fixed vulnerabilities
    manual: true
  - id: II.5
    name: Put in place and enforce a policy on coordinated vulnerability disclosure
    manual: true
  - id: II.6
    name: Facilitate the sharing of information about potential vulnerabilities, including by providing a contact
