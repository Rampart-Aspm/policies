  evidenceWindowDays: 30
  controls:
  - id: 164.308.a.1.ii.A
    name: Risk analysis (Required)
    manual: true
  - id: 164.308.a.1.ii.B
    name: 'Risk management (Required): reduce risks and vulnerabilities to a reasonable and appropriate level'
    match:
