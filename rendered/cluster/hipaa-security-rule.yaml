apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterComplianceFramework
metadata:
  name: hipaa-security-rule
spec:
  displayName: 'HIPAA Security Rule (45 CFR 164): technical safeguards subset'
  version: 45 CFR 164, subpart C
  source: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C/part-164/subpart-C
  logoUrl: https://raw.githubusercontent.com/Rampart-Aspm/policies/main/logos/hipaa-security-rule.svg
  description: The standards of the Security Rule that bear on software that stores or moves electronic protected
    health information.
  note: 'An approximation. Ids are the section path with dots: 164.308.a.1.ii.A is 164.308(a)(1)(ii)(A). Encryption
