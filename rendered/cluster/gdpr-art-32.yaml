    name: Pseudonymisation and encryption of personal data
    match:
      cwes:
      - 311
      - 312
      - 319
      - 327
  - id: Art32.1.b
    name: Ongoing confidentiality, integrity, availability and resilience of processing systems and services
    manual: true
  - id: Art32.1.c
    name: Ability to restore availability and access to personal data in a timely manner after an incident
    manual: true
  - id: Art32.1.d
    name: A process for regularly testing, assessing and evaluating the effectiveness of the measures
    match:
      categories:
      - sca
      - container
      - sast
      - dast
      minSeverity: critical
