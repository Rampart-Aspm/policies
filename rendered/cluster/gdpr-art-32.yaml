apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterComplianceFramework
metadata:
  name: gdpr-art-32
spec:
  displayName: 'GDPR: Article 32, security of processing, with Article 25'
  version: Regulation (EU) 2016/679
  source: https://eur-lex.europa.eu/eli/reg/2016/679/oj
  logoUrl: https://raw.githubusercontent.com/Rampart-Aspm/policies/main/logos/gdpr-art-32.svg
  description: The technical and organisational measures of Article 32 that software scanning can speak to, and
    data protection by design.
  note: 'An approximation. Article 32 is risk-based and names measures as examples, so no scan proves compliance;
    this shows the evidence a regulator may ask for. Ids: Art32.1.a is Article 32(1)(a).'
  appliesTo:
    complianceScope: gdpr
  evidenceWindowDays: 30
  controls:
