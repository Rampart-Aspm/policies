apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterComplianceFramework
metadata:
  name: soc2-tsc
spec:
  displayName: 'SOC 2: Trust Services Criteria, common criteria (security)'
  version: 2017 TSC, revised points of focus 2022
  source: https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services
  logoUrl: https://raw.githubusercontent.com/Rampart-Aspm/policies/main/logos/soc2-tsc.svg
  description: The common criteria of the security category that a scanner can speak to, and the ones an auditor
    will ask a person about.
  note: An approximation. The criteria text is the AICPA's, so only the identifiers are used. The AICPA has opened
    a revision with different numbering; check the ids before an audit.
  appliesTo:
    complianceScope: soc2
  evidenceWindowDays: 30
  controls:
  - id: CC3.2
    name: Risks to objectives are identified and analysed
    manual: true
  - id: CC6.1
    name: Logical access protections (no credentials in code)
    match:
      categories:
      - secret
  - id: CC6.6
    name: Protection against threats from outside the system boundary
    match:
      categories:
      - dast
      minSeverity: high
  - id: CC6.8
    name: Prevent or detect unauthorised or malicious software
    match:
      categories:
      - supply_chain
    evidence:
      categories:
      - supply_chain
      - sca
  - id: CC7.1
    name: Detect new vulnerabilities and configuration changes
    match:
      categories:
      - sca
      - container
      - sast
      - dast
      - iac
      minSeverity: high
    evidence:
      categories:
      - sca
      - container
      - sast
      - dast
  - id: CC8.1
    name: Changes are authorised, tested and approved
    manual: true
  - id: CC9.2
    name: Vendor and business-partner risk
    manual: true
