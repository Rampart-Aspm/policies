apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterComplianceFramework
metadata:
  name: pci-dss-4.0.1-extended
spec:
  displayName: 'PCI DSS 4.0.1: configuration, cryptography, scanning and testing (complements the built-in requirement
    6 view)'
  version: 4.0.1
  source: https://www.pcisecuritystandards.org/document_library/
  logoUrl: https://raw.githubusercontent.com/Rampart-Aspm/policies/main/logos/pci-dss-4.0.1-extended.svg
  description: The PCI DSS requirements outside requirement 6 that scanning and testing can speak to (2.2, 3.5,
    4.2, 11.3, 11.4), plus the requirement 6 items that are people or process (6.2.1, 6.2.2, 6.3.2, 6.4.2, 6.5.1).
    Rampart already carries a built-in framework for 6.2.3, 6.2.4, 6.3.1, 6.3.3, 6.4.1 and 8.6.2, so those are not
    repeated here.
  note: 'An approximation, and a complement: enable the built-in PCI DSS framework as well. PCI DSS lists no weaknesses,
    so the cryptography and storage controls use weakness lists that are ours.'
  appliesTo:
    complianceScope: pci-dss
  evidenceWindowDays: 90
  controls:
  - id: 2.2.1
    name: Configuration standards are developed, implemented and maintained for all system components
    match:
      categories:
      - iac
      - cspm
      minSeverity: medium
  - id: 3.5.1
    name: Stored account data is rendered unreadable wherever it is stored
    match:
      cwes:
      - 311
      - 312
      - 313
  - id: 4.2.1
    name: Strong cryptography protects account data in transit over open public networks
    match:
      cwes:
      - 319
      - 295
      - 297
      - 326
      - 327
  - id: 6.2.1
    name: Bespoke and custom software is developed securely
    manual: true
  - id: 6.2.2
    name: Software development personnel are trained in secure development at least every twelve months
    manual: true
  - id: 6.3.2
    name: An inventory of bespoke and custom software and third-party components is maintained
    manual: true
    description: 'Evidence: an SBOM is uploaded for every application.'
  - id: 6.4.2
    name: An automated technical solution that detects and prevents web-based attacks protects public-facing web
      applications
    manual: true
    description: 'Evidence: the application''s compensating controls list a WAF or API gateway.'
  - id: 6.5.1
    name: Changes to system components follow change control procedures
    manual: true
  - id: 11.3.1
    name: Internal vulnerability scans are run at least every three months, high-risk and critical findings are
      resolved and rescanned
    match:
      categories:
      - sca
      - container
      - sast
      - dast
      - iac
      minSeverity: high
    evidence:
      categories:
      - sca
      - container
      - sast
      - dast
  - id: 11.3.2
    name: External vulnerability scans are run at least every three months by an Approved Scanning Vendor
    manual: true
  - id: 11.4.1
    name: A penetration testing methodology is defined, documented and implemented
    manual: true
  - id: 11.4.2
    name: Internal penetration testing is performed at least every twelve months and after significant change
    manual: true
  - id: 11.4.3
    name: External penetration testing is performed at least every twelve months and after significant change
    manual: true
