{{- /* GENERATED by scripts/generate.py from frameworks/gdpr-art-32.yaml. Do not edit this file: edit the source and run the script. */ -}}
{{- if .Values.compliance.gdpr.enabled }}
---
apiVersion: rampart.aspm.dev/v1alpha1
kind: {{ include "rampart-policies.kind" (dict "ctx" . "kind" "ComplianceFramework") }}
metadata:
  {{- include "rampart-policies.meta" (dict "ctx" . "name" "gdpr-art-32") | nindent 2 }}
spec:
  displayName: "GDPR: Article 32, security of processing, with Article 25"
  version: "Regulation (EU) 2016/679"
  source: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
  {{- $logo := index (.Values.compliance.logoUrls | default dict) "gdpr" }}
  {{- if and (not $logo) .Values.compliance.logos }}
  {{- $logo = printf "%s/%s.svg" (.Values.compliance.logoBaseUrl | trimSuffix "/") "gdpr-art-32" }}
  {{- end }}
  {{- if $logo }}
  logoUrl: {{ $logo | quote }}
  {{- end }}
  description: "The technical and organisational measures of Article 32 that software scanning can speak to, and data protection by design."
  note: "An approximation. Article 32 is risk-based and names measures as examples, so no scan proves compliance; this shows the evidence a regulator may ask for. Ids: Art32.1.a is Article 32(1)(a)."
  appliesTo: {complianceScope: gdpr}
  evidenceWindowDays: 30
  controls:
    - {"id": "Art32.1.a", "name": "Pseudonymisation and encryption of personal data", "match": {"cwes": [311, 312, 319, 327]}}
    - {"id": "Art32.1.b", "name": "Ongoing confidentiality, integrity, availability and resilience of processing systems and services", "manual": true}
    - {"id": "Art32.1.c", "name": "Ability to restore availability and access to personal data in a timely manner after an incident", "manual": true}
    - {"id": "Art32.1.d", "name": "A process for regularly testing, assessing and evaluating the effectiveness of the measures", "match": {"categories": ["sca", "container", "sast", "dast"], "minSeverity": "critical"}, "evidence": {"categories": ["sca", "container", "sast", "dast"]}, "description": "Read as: tested lately, and nothing critical left open."}
    - {"id": "Art25", "name": "Data protection by design and by default", "manual": true}
{{- end }}
