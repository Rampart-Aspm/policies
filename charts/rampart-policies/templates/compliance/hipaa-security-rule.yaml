{{- /* GENERATED by scripts/generate.py from frameworks/hipaa-security-rule.yaml. Do not edit this file: edit the source and run the script. */ -}}
{{- if .Values.compliance.hipaa.enabled }}
---
apiVersion: rampart.aspm.dev/v1alpha1
kind: {{ include "rampart-policies.kind" (dict "ctx" . "kind" "ComplianceFramework") }}
metadata:
  {{- include "rampart-policies.meta" (dict "ctx" . "name" "hipaa-security-rule") | nindent 2 }}
spec:
  displayName: "HIPAA Security Rule (45 CFR 164): technical safeguards subset"
  version: "45 CFR 164, subpart C"
  source: "https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C/part-164/subpart-C"
  {{- $logo := index (.Values.compliance.logoUrls | default dict) "hipaa" }}
  {{- if and (not $logo) .Values.compliance.logos }}
  {{- $logo = printf "%s/%s.svg" (.Values.compliance.logoBaseUrl | trimSuffix "/") "hipaa-security-rule" }}
  {{- end }}
  {{- if $logo }}
  logoUrl: {{ $logo | quote }}
  {{- end }}
  description: "The standards of the Security Rule that bear on software that stores or moves electronic protected health information."
  note: "An approximation. Ids are the section path with dots: 164.308.a.1.ii.A is 164.308(a)(1)(ii)(A). Encryption is an addressable specification in the rule, not an absolute requirement."
  appliesTo: {complianceScope: hipaa}
  evidenceWindowDays: 30
  controls:
    - {"id": "164.308.a.1.ii.A", "name": "Risk analysis (Required)", "manual": true}
    - {"id": "164.308.a.1.ii.B", "name": "Risk management (Required): reduce risks and vulnerabilities to a reasonable and appropriate level", "match": {"categories": ["sca", "container", "sast", "dast"], "minSeverity": "high"}}
    - {"id": "164.308.a.5.ii.B", "name": "Protection from malicious software (Addressable)", "match": {"categories": ["supply_chain"]}, "evidence": {"categories": ["supply_chain", "sca"]}}
    - {"id": "164.308.a.8", "name": "Evaluation: periodic technical and nontechnical evaluation", "match": {"categories": ["sca", "container", "sast", "dast"], "minSeverity": "critical"}, "evidence": {"categories": ["sca", "container", "sast", "dast"]}, "description": "Read as: tested lately, and nothing critical left open."}
    - {"id": "164.312.a.1", "name": "Access control (no credentials in code)", "match": {"categories": ["secret"]}}
    - {"id": "164.312.a.2.iv", "name": "Encryption and decryption (Addressable)", "match": {"cwes": [311, 312, 326, 327]}}
    - {"id": "164.312.c.1", "name": "Integrity: protect information from improper alteration or destruction", "match": {"cwes": [345, 494]}}
    - {"id": "164.312.d", "name": "Person or entity authentication", "match": {"cwes": [287, 306, 798]}}
    - {"id": "164.312.e.1", "name": "Transmission security", "match": {"cwes": [319, 295, 297]}}
{{- end }}
