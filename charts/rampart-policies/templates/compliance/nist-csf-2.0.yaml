{{- /* GENERATED by scripts/generate.py from frameworks/nist-csf-2.0.yaml. Do not edit this file: edit the source and run the script. */ -}}
{{- if .Values.compliance.nistcsf.enabled }}
---
apiVersion: rampart.aspm.dev/v1alpha1
kind: {{ include "rampart-policies.kind" (dict "ctx" . "kind" "ComplianceFramework") }}
metadata:
  {{- include "rampart-policies.meta" (dict "ctx" . "name" "nist-csf-2.0") | nindent 2 }}
spec:
  displayName: "NIST Cybersecurity Framework 2.0: software and vulnerability outcomes"
  version: "2.0"
  source: "https://www.nist.gov/cyberframework"
  {{- $logo := index (.Values.compliance.logoUrls | default dict) "nistcsf" }}
  {{- if and (not $logo) .Values.compliance.logos }}
  {{- $logo = printf "%s/%s.svg" (.Values.compliance.logoBaseUrl | trimSuffix "/") "nist-csf-2.0" }}
  {{- end }}
  {{- if $logo }}
  logoUrl: {{ $logo | quote }}
  {{- end }}
  description: "The outcomes of the framework that bear on software, vulnerabilities, configuration and the software supply chain."
  note: "An approximation. The framework states outcomes, not requirements, so a matched control shows evidence toward an outcome."
  appliesTo: {complianceScope: nist-csf}
  evidenceWindowDays: 30
  controls:
    - {"id": "GV.SC-04", "name": "Suppliers are known and prioritized by criticality", "manual": true}
    - {"id": "GV.SC-07", "name": "The risks posed by a supplier, their products and services, and other third parties are understood, recorded, prioritized, assessed, responded to, and monitored over the course of the relationship", "manual": true}
    - {"id": "GV.SC-09", "name": "Supply chain security practices are integrated into cybersecurity and enterprise risk management programs, and their performance is monitored throughout the technology product and service life cycle", "manual": true}
    - {"id": "ID.AM-02", "name": "Inventories of software, services, and systems managed by the organization are maintained", "manual": true, "description": "Evidence: an SBOM is uploaded for every application."}
    - {"id": "ID.RA-01", "name": "Vulnerabilities in assets are identified, validated, and recorded", "match": {"categories": ["sca", "container", "sast", "dast"], "minSeverity": "critical"}, "evidence": {"categories": ["sca", "container", "sast", "dast"]}, "description": "Read as: scanned lately, and nothing critical left open."}
    - {"id": "ID.RA-05", "name": "Threats, vulnerabilities, likelihoods, and impacts are used to understand inherent risk and inform risk response prioritization", "manual": true, "description": "Evidence: the risk score and its factor breakdown, which use threat data (KEV, EPSS) and the application's context."}
    - {"id": "ID.RA-08", "name": "Processes for receiving, analyzing, and responding to vulnerability disclosures are established", "manual": true}
    - {"id": "ID.RA-09", "name": "The authenticity and integrity of hardware and software are assessed prior to acquisition and use", "match": {"categories": ["supply_chain"]}, "evidence": {"categories": ["supply_chain", "sca"]}}
    - {"id": "ID.IM-02", "name": "Improvements are identified from security tests and exercises, including those done in coordination with suppliers and relevant third parties", "manual": true}
    - {"id": "PR.PS-01", "name": "Configuration management practices are established and applied", "match": {"categories": ["iac", "cspm"], "minSeverity": "medium"}}
    - {"id": "PR.PS-02", "name": "Software is maintained, replaced, and removed commensurate with risk", "match": {"categories": ["sca", "container"], "minSeverity": "high"}}
    - {"id": "PR.PS-06", "name": "Secure software development practices are integrated, and their performance is monitored throughout the software development life cycle", "match": {"categories": ["sast"], "minSeverity": "high"}, "evidence": {"categories": ["sast", "dast"]}}
    - {"id": "PR.DS-01", "name": "The confidentiality, integrity, and availability of data-at-rest are protected", "match": {"cwes": [311, 312, 313]}}
    - {"id": "PR.DS-02", "name": "The confidentiality, integrity, and availability of data-in-transit are protected", "match": {"cwes": [319, 295, 297]}}
    - {"id": "PR.AA-01", "name": "Identities and credentials for authorized users, services, and hardware are managed by the organization", "match": {"categories": ["secret"]}}
{{- end }}
