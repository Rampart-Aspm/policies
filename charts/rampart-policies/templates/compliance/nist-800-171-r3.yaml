    - {"id": "03.11.04", "name": "Risk Response", "manual": true}
    - {"id": "03.13.08", "name": "Transmission and Storage Confidentiality", "match": {"cwes": [319, 295, 297, 311, 312, 313]}}
    - {"id": "03.13.11", "name": "Cryptographic Protection", "match": {"cwes": [326, 327, 328, 330, 759, 916]}}
    - {"id": "03.14.01", "name": "Flaw Remediation", "match": {"categories": ["sca", "container"], "minSeverity": "high"}}
    - {"id": "03.14.02", "name": "Malicious Code Protection", "match": {"categories": ["supply_chain"]}, "evidence": {"categories": ["supply_chain", "sca"]}}
    - {"id": "03.16.01", "name": "Security Engineering Principles", "manual": true}
    - {"id": "03.16.02", "name": "Unsupported System Components", "manual": true}
    - {"id": "03.16.03", "name": "External System Services", "manual": true}
    - {"id": "03.17.01", "name": "Supply Chain Risk Management Plan", "manual": true}
    - {"id": "03.17.03", "name": "Supply Chain Requirements and Processes", "manual": true}
