{{- /* GENERATED by scripts/generate.py from frameworks/soc2-tsc.yaml. Do not edit this file: edit the source and run the script. */ -}}
{{- if .Values.compliance.soc2.enabled }}
---
apiVersion: rampart.aspm.dev/v1alpha1
kind: {{ include "rampart-policies.kind" (dict "ctx" . "kind" "ComplianceFramework") }}
metadata:
  {{- include "rampart-policies.meta" (dict "ctx" . "name" "soc2-tsc") | nindent 2 }}
spec:
  displayName: "SOC 2: Trust Services Criteria, common criteria (security)"
  version: "2017 TSC, revised points of focus 2022"
  source: "https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services"
  {{- $logo := index (.Values.compliance.logoUrls | default dict) "soc2" }}
  {{- if and (not $logo) .Values.compliance.logos }}
  {{- $logo = printf "%s/%s.svg" (.Values.compliance.logoBaseUrl | trimSuffix "/") "soc2-tsc" }}
  {{- end }}
  {{- if $logo }}
  logoUrl: {{ $logo | quote }}
  {{- end }}
  description: "The common criteria of the security category that a scanner can speak to, and the ones an auditor will ask a person about."
  note: "An approximation. The criteria text is the AICPA's, so only the identifiers are used. The AICPA has opened a revision with different numbering; check the ids before an audit."
  appliesTo: {complianceScope: soc2}
  evidenceWindowDays: 30
  controls:
    - {"id": "CC3.2", "name": "Risks to objectives are identified and analysed", "manual": true}
    - {"id": "CC6.1", "name": "Logical access protections (no credentials in code)", "match": {"categories": ["secret"]}}
    - {"id": "CC6.6", "name": "Protection against threats from outside the system boundary", "match": {"categories": ["dast"], "minSeverity": "high"}}
    - {"id": "CC6.8", "name": "Prevent or detect unauthorised or malicious software", "match": {"categories": ["supply_chain"]}, "evidence": {"categories": ["supply_chain", "sca"]}}
    - {"id": "CC7.1", "name": "Detect new vulnerabilities and configuration changes", "match": {"categories": ["sca", "container", "sast", "dast", "iac"], "minSeverity": "high"}, "evidence": {"categories": ["sca", "container", "sast", "dast"]}}
    - {"id": "CC8.1", "name": "Changes are authorised, tested and approved", "manual": true}
    - {"id": "CC9.2", "name": "Vendor and business-partner risk", "manual": true}
{{- end }}
