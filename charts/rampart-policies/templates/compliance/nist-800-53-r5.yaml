{{- /* GENERATED by scripts/generate.py from frameworks/nist-800-53-r5.yaml. Do not edit this file: edit the source and run the script. */ -}}
{{- if .Values.compliance.nist80053.enabled }}
---
apiVersion: rampart.aspm.dev/v1alpha1
kind: {{ include "rampart-policies.kind" (dict "ctx" . "kind" "ComplianceFramework") }}
metadata:
  {{- include "rampart-policies.meta" (dict "ctx" . "name" "nist-800-53-r5") | nindent 2 }}
spec:
  displayName: "NIST SP 800-53 Rev. 5: vulnerability and supply-chain subset"
  version: "Rev. 5"
  source: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
  {{- $logo := index (.Values.compliance.logoUrls | default dict) "nist80053" }}
  {{- if and (not $logo) .Values.compliance.logos }}
  {{- $logo = printf "%s/%s.svg" (.Values.compliance.logoBaseUrl | trimSuffix "/") "nist-800-53-r5" }}
  {{- end }}
  {{- if $logo }}
  logoUrl: {{ $logo | quote }}
  {{- end }}
  description: "The controls of the US federal security catalogue (the base of FedRAMP) that software scanning can speak to: risk and vulnerability management, flaw remediation, developer testing, secrets, cryptography, input validation and supply chain."
  note: "An approximation. IA-5.7 is control enhancement IA-5(7): the server does not accept parentheses in an id."
  appliesTo: {complianceScope: nist-800-53}
  evidenceWindowDays: 30
  controls:
    - {"id": "RA-3", "name": "Risk Assessment", "manual": true}
    - {"id": "RA-5", "name": "Vulnerability Monitoring and Scanning", "match": {"categories": ["sca", "container", "sast", "dast", "iac"], "minSeverity": "high"}, "evidence": {"categories": ["sca", "container", "sast", "dast"]}}
    - {"id": "SI-2", "name": "Flaw Remediation", "match": {"categories": ["sca", "container"], "minSeverity": "high"}}
    - {"id": "SA-11", "name": "Developer Testing and Evaluation", "match": {"categories": ["sast"], "minSeverity": "high"}, "evidence": {"categories": ["sast", "dast"]}}
    - {"id": "SA-15", "name": "Development Process, Standards, and Tools", "manual": true}
    - {"id": "SR-3", "name": "Supply Chain Controls and Processes", "manual": true}
    - {"id": "SR-4", "name": "Provenance", "match": {"categories": ["supply_chain"]}, "evidence": {"categories": ["supply_chain", "sca"]}}
    - {"id": "CM-6", "name": "Configuration Settings", "match": {"categories": ["iac", "cspm"], "minSeverity": "medium"}}
    - {"id": "CM-8", "name": "System Component Inventory", "manual": true, "description": "Evidence: an SBOM is uploaded for every application."}
    - {"id": "IA-5.7", "name": "No Embedded Unencrypted Static Authenticators", "match": {"categories": ["secret"]}}
    - {"id": "SC-8", "name": "Transmission Confidentiality and Integrity", "match": {"cwes": [319, 295, 297]}}
    - {"id": "SC-13", "name": "Cryptographic Protection", "match": {"cwes": [326, 327, 328, 330, 759, 916]}}
    - {"id": "SC-28", "name": "Protection of Information at Rest", "match": {"cwes": [311, 312, 313]}}
    - {"id": "SI-10", "name": "Information Input Validation", "match": {"cwes": [20, 22, 77, 78, 79, 89, 94, 502, 611, 918]}}
    - {"id": "CA-8", "name": "Penetration Testing", "match": {"categories": ["dast"], "minSeverity": "high"}}
{{- end }}
