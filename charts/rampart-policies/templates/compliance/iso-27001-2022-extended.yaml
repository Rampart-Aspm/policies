{{- /* GENERATED by scripts/generate.py from frameworks/iso-27001-2022.yaml. Do not edit this file: edit the source and run the script. */ -}}
{{- if .Values.compliance.iso27001.enabled }}
---
apiVersion: rampart.aspm.dev/v1alpha1
kind: {{ include "rampart-policies.kind" (dict "ctx" . "kind" "ComplianceFramework") }}
metadata:
  {{- include "rampart-policies.meta" (dict "ctx" . "name" "iso-27001-2022-extended") | nindent 2 }}
spec:
  displayName: "ISO/IEC 27001:2022 Annex A: supply chain and secure development (complements the built-in A.8 view)"
  version: "2022"
  source: "https://www.iso.org/standard/27001"
  {{- $logo := index (.Values.compliance.logoUrls | default dict) "iso27001" }}
  {{- if and (not $logo) .Values.compliance.logos }}
  {{- $logo = printf "%s/%s.svg" (.Values.compliance.logoBaseUrl | trimSuffix "/") "iso-27001-2022-extended" }}
  {{- end }}
  {{- if $logo }}
  logoUrl: {{ $logo | quote }}
  {{- end }}
  description: "The Annex A controls on suppliers, source code, cryptography and the development life cycle that the built-in framework does not carry. Rampart already carries A.5.17, A.8.8, A.8.9, A.8.28 and A.8.29, so those are not repeated here."
  note: "An approximation, and a complement: enable the built-in ISO 27001 framework as well. Most of what ISO 27001 asks for is management-system practice, so most controls here are manual."
  appliesTo: {complianceScope: iso-27001}
  evidenceWindowDays: 30
  controls:
    - {"id": "A.5.19", "name": "Information security in supplier relationships", "manual": true}
    - {"id": "A.5.20", "name": "Addressing information security within supplier agreements", "manual": true}
    - {"id": "A.5.21", "name": "Managing information security in the ICT supply chain", "manual": true}
    - {"id": "A.5.22", "name": "Monitoring, review and change management of supplier services", "manual": true}
    - {"id": "A.8.4", "name": "Access to source code is managed", "manual": true}
    - {"id": "A.8.24", "name": "Use of cryptography", "match": {"cwes": [326, 327, 328, 330, 759, 916]}}
    - {"id": "A.8.25", "name": "Secure development life cycle", "manual": true}
    - {"id": "A.8.26", "name": "Application security requirements", "manual": true}
    - {"id": "A.8.27", "name": "Secure system architecture and engineering principles", "manual": true}
    - {"id": "A.8.30", "name": "Outsourced development is supervised and monitored", "manual": true}
    - {"id": "A.8.31", "name": "Development, test and production environments are separated", "manual": true}
    - {"id": "A.8.32", "name": "Changes follow change management procedures", "manual": true}
{{- end }}
